# token-pilot 状态栏应用 — Windows / macOS 构建
# 触发：打 v* tag 或手动 dispatch。产出 .msi（Windows x64）与 .dmg（macOS arm64 + Intel）。

name: build-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: menubar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Windows 交叉/本机构建 token-pilot CLI 依赖 node 全局安装由用户侧 npm link 提供；
      # 桌面应用本身只依赖 Rust 工具链。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            menubar/src-tauri/target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('menubar/src-tauri/Cargo.lock') }}

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 校验打包资源与 web/ 源一致（防发出旧前端）
        run: node scripts/sync-web-assets.js --check
        working-directory: .

      - name: Clean stale bundle artifacts（防缓存带旧版本包）
        shell: bash
        run: rm -rf src-tauri/target/*/release/bundle src-tauri/target/release/bundle
        working-directory: menubar

      - name: Build bundles
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: menubar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Assemble updater manifest (latest.json)
        shell: bash
        working-directory: menubar
        run: |
          set -e
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          APP_TGZ=$(ls $B/macos/*.app.tar.gz 2>/dev/null || true)
          MSI=$(ls $B/msi/*.msi 2>/dev/null | head -1 || true)
          VER=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])" 2>/dev/null || node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          PLAT=""
          if [ -n "$APP_TGZ" ]; then
            SIG=$(cat "$APP_TGZ.sig")
            case "${{ matrix.target }}" in
              aarch64-apple-darwin) PLAT=darwin-aarch64 ;;
              x86_64-apple-darwin) PLAT=darwin-x86_64 ;;
            esac
            case "${{ matrix.target }}" in
              aarch64-apple-darwin) ARCH=aarch64 ;;
              x86_64-apple-darwin)  ARCH=x64 ;;
            esac
            F="token-pilot_${VER}_${ARCH}.app.tar.gz"
          elif [ -n "$MSI" ]; then
            SIG=$(cat "$MSI.sig")
            PLAT=windows-x86_64
            F="token-pilot_${VER}_x64.msi"
          fi
          if [ -n "$PLAT" ]; then
            # 片段按 target 命名：三平台并行上传后不会互相覆盖（latest.json 同名会丢平台）
            cat > "$B/latest-${{ matrix.target }}.json" <<JSON
          {
            "version": "v$VER",
            "notes": "token-pilot v$VER",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "$PLAT": {
                "signature": "$SIG",
                "url": "https://github.com/anthonyhann/token-pilot/releases/download/v$VER/$F"
              }
            }
          }
          JSON
          fi

      # 先把要发布的文件收进一个扁平目录：
      # 1) 直接上传 target/... 相对路径会让 artifact 里保留 menubar/src-tauri/... 层级，
      #    release job 在仓库根用 artifacts/*.dmg 就匹配不到（v0.2.8 首次自动发布踩过）
      # 2) dmg / app.tar.gz 必须先按 target 改名，否则两个 mac 平台的同名文件会互相覆盖
      - name: Stage release files（拍平 + 按平台改名）
        shell: bash
        working-directory: menubar
        run: |
          set -e
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          OUT=../dist-release
          VER=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          rm -rf "$OUT" && mkdir -p "$OUT"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin)  ARCH=x64 ;;
            x86_64-pc-windows-msvc) ARCH=x64 ;;
            *) ARCH=${{ matrix.target }} ;;
          esac
          for f in "$B"/dmg/*.dmg; do
            [ -e "$f" ] || continue
            cp "$f" "$OUT/token-pilot_${VER}_${ARCH}.dmg"
          done
          for f in "$B"/macos/*.app.tar.gz; do
            [ -e "$f" ] || continue
            cp "$f" "$OUT/token-pilot_${VER}_${ARCH}.app.tar.gz"
            cp "$f.sig" "$OUT/token-pilot_${VER}_${ARCH}.app.tar.gz.sig"
          done
          for f in "$B"/msi/*.msi; do
            [ -e "$f" ] || continue
            # 与 latest.json 片段里的 F 保持一致
            cp "$f" "$OUT/token-pilot_${VER}_x64.msi"
            cp "$f.sig" "$OUT/token-pilot_${VER}_x64.msi.sig"
          done
          cp "$B"/latest-${{ matrix.target }}.json "$OUT/"
          ls -la "$OUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: token-pilot-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

  # ── 汇总发布 ────────────────────────────────────────────────
  # 三平台并行构建后，把各自的 latest.json 片段合并成一份（三平台齐全），
  # 连同安装包一起发到 GitHub Release。缺任何一平台直接失败，不回退到「部分可用」。
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 校验版本号一致（tag = tauri.conf.json = package.json = Cargo.toml）
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          V_CONF=$(node -e "console.log(require('./menubar/src-tauri/tauri.conf.json').version)")
          V_PKG=$(node -e "console.log(require('./package.json').version)")
          V_CARGO=$(grep -m1 '^version' menubar/src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$TAG conf=$V_CONF pkg=$V_PKG cargo=$V_CARGO"
          for v in "$V_CONF" "$V_PKG" "$V_CARGO"; do
            [ "$v" = "$TAG" ] || { echo "::error::版本号不一致：tag=$TAG，但某处仍是 $v"; exit 1; }
          done

      - name: 下载三平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 合并 latest.json（三平台必须齐全）
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import glob, json, os, datetime, sys
          frags = sorted(glob.glob('artifacts/**/latest-*.json', recursive=True))
          if not frags:
              sys.exit('::error::没有找到任何 latest-*.json 片段')
          platforms, version = {}, None
          for f in frags:
              d = json.load(open(f))
              version = d.get('version') or version
              for k, v in (d.get('platforms') or {}).items():
                  if k in platforms:
                      sys.exit(f'::error::平台 {k} 出现重复片段')
                  platforms[k] = v
          need = {'darwin-aarch64', 'darwin-x86_64', 'windows-x86_64'}
          missing = need - set(platforms)
          if missing:
              sys.exit(f'::error::三平台不全，缺少 {sorted(missing)}；实际 {sorted(platforms)}')
          # notes 取仓库内 CHANGELOG 对应段落，避免残留「CI 构建中」
          ver = (version or '').lstrip('v')
          notes = f'token-pilot v{ver}'
          cl = 'RELEASE_NOTES.md'
          if os.path.exists(cl):
              # 只认行首的 '## vX.Y.Z' 标题：文件头里也写了 '## v0.2.7' 之类的示例，
              # 用裸字符串 split 会抽到那段说明而不是真正的发布段落
              import re
              txt = open(cl, encoding='utf-8').read()
              pat = rf'^## v{re.escape(ver)}\s*$'
              m = re.search(pat, txt, re.M)
              if not m:
                  sys.exit(f'::error::RELEASE_NOTES.md 里找不到「## v{ver}」段落')
              rest = txt[m.end():]
              nxt = re.search(r'^## v\S+\s*$', rest, re.M)
              body = (rest[:nxt.start()] if nxt else rest).strip().strip('-').strip()
              if body:
                  notes = body
              else:
                  sys.exit(f'::error::RELEASE_NOTES.md 的「## v{ver}」段落是空的')
          # 只检查真正会被客户端展示的正文
          if '构建中' in notes:
              sys.exit('::error::notes 里残留「构建中」字样')
          out = {
              'version': f'v{ver}',
              'notes': notes,
              'pub_date': datetime.datetime.now(datetime.timezone.utc)
                          .strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {k: platforms[k] for k in sorted(platforms)},
          }
          json.dump(out, open('artifacts/latest.json', 'w'), ensure_ascii=False, indent=2)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: 校验 latest.json 引用的文件都在待上传目录
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open('artifacts/latest.json', encoding='utf-8'))
          missing = []
          for plat, info in d['platforms'].items():
              name = info['url'].rsplit('/', 1)[-1]
              if not os.path.exists(os.path.join('artifacts', name)):
                  missing.append(f'{plat} -> {name}')
          if missing:
              sys.exit('::error::latest.json 引用的文件不存在：' + '; '.join(missing))
          print('✓ 三平台引用的安装包都在')
          PY

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: token-pilot ${{ github.ref_name }}
          draft: false
          prerelease: false
          # latest.json 必须是一个整份、含三平台的文件，由上面合并步骤产出
          files: |
            artifacts/latest.json
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.msi.sig
            artifacts/*.app.tar.gz
            artifacts/*.app.tar.gz.sig
          fail_on_unmatched_files: true

      - name: 回写 brew cask（版本 + aarch64 dmg 的 sha256）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::未配置 HOMEBREW_TAP_TOKEN，跳过 brew cask 更新（需手动 bump）"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          DMG="token-pilot_${VER}_aarch64.dmg"
          # Release 已上传完成后再算 sha256
          curl -sSL --retry 5 --retry-delay 5 -o /tmp/app.dmg \
            "https://github.com/anthonyhann/token-pilot/releases/download/${GITHUB_REF_NAME}/${DMG}"
          SHA=$(shasum -a 256 /tmp/app.dmg | awk '{print $1}')
          echo "sha256=$SHA"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/anthonyhann/homebrew-token-pilot.git" /tmp/tap
          CASK=/tmp/tap/Casks/token-pilot.rb
          sed -i -E "s/^  version \".*\"/  version \"${VER}\"/" "$CASK"
          sed -i -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" "$CASK"
          cd /tmp/tap
          git -c user.name="token-pilot bot" -c user.email="bmomhan@gmail.com" \
              commit -am "token-pilot ${VER}" || { echo "cask 无变化，跳过"; exit 0; }
          git push
